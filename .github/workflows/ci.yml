name: CI

on:
  # Feature branches get CI through the pull_request event. We deliberately do
  # NOT run `push:` on every branch — a push to a PR branch would otherwise
  # trigger BOTH a push-run and a pull_request-run of this same workflow (the
  # duplicate "CI (push)" + "CI (pull_request)" checks), doubling runner usage
  # and flake exposure. Pushes to the long-lived branches still run CI.
  #
  # pull_request has NO base-branch filter: stacked PRs (GitHub Stacks) target
  # another PR's branch rather than master, and the stack's atomic merge still
  # requires every layer to carry the four required checks. Filtering to
  # base=master starved the upper layers of CI. There is still exactly one run
  # per PR (push stays restricted to the long-lived branches above).
  push:
    branches: [master, dev]
  pull_request:

# Cancel superseded in-progress runs for the same branch (e.g. rapid pushes to an
# open PR) so only the latest commit's CI consumes a runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Typecheck is BLOCKING: the pre-existing error baseline was cleaned to zero,
      # so any failure here is new type drift. (next.config.ts still sets
      # typescript.ignoreBuildErrors, so this step is the only type gate.)
      - name: TypeScript check
        run: npx tsc --noEmit
      # Lint stays advisory until its pre-existing debt (64 errors at last count)
      # is cleaned; then drop continue-on-error here too.
      - run: npm run lint
        continue-on-error: true

  test:
    name: unit + integration
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Supabase CLI is already in devDependencies; this exposes it on PATH for the next steps.
      - name: Start local Supabase
        run: npx supabase start

      - name: Capture Supabase env to .env.test.local
        run: |
          STATUS=$(npx supabase status --output json)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r '.API_URL')"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r '.ANON_KEY')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r '.SERVICE_ROLE_KEY')"
            echo "STRIPE_ENABLED=true"
            echo "NEXT_PUBLIC_STRIPE_ENABLED=true"
            echo "STRIPE_SECRET_KEY=sk_test_fake_for_tests"
            echo "STRIPE_WEBHOOK_SECRET=whsec_fake_for_tests"
          } > .env.test.local

      - name: Run unit + integration tests
        run: npm run test
        env:
          CI: 'true'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
